<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QA — input + cofre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <div id="klog" style="position:absolute;left:4px;top:4px;right:4px;z-index:60;background:#000;color:#0f0;border:1px solid #0f0;font:12px monospace;padding:4px;min-height:32px;word-break:break-all;">ESPERANDO TECLA...</div>

  <div class="screen" style="z-index:10">
    <div class="panel">
      <h2>¡COFRE DE SUSCRIPTOR!</h2>
      <div id="chest-items">
        <div class="ci"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="18" height="18"><span><b>Polaroid Flash</b> — Lanza 3 fotos al enemigo más cercano cada 1.5s.</span></div>
        <div class="ci" style="animation-play-state:paused;animation-delay:-0.1s;outline:2px solid #0ff"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="18" height="18"><span><b>CACA (MID-POP CONGELADO)</b> — repro de la animación a media pasada.</span></div>
        <div class="ci" style="animation:none;transform:scale(2);outline:2px solid #f0f"><b>STATICO scale(2)</b> — caso máximo de overflow.</div>
      </div>
      <button class="btn">CONTINUAR</button>
    </div>
  </div>

</div>

<script>
(function () {
  const log = [];
  function add(tag, e) {
    log.unshift(tag + ' code=' + e.code + ' key=' + JSON.stringify(e.key));
    if (log.length > 6) log.pop();
    document.getElementById('klog').textContent = log.join('   |   ');
  }
  window.addEventListener('keydown', (e) => add('WIN', e));
  document.addEventListener('keydown', (e) => add('DOC', e), true);
})();
</script>
</body>
</html>
