<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314141a'/%3E%3Cpath d='M3 12V4h2l3 4 3-4h2v8h-2V7l-3 4-3-4v5z' fill='%239146ff'/%3E%3C/svg%3E">
<title>QA — Galería de sprites</title>
<style>
  body { background:#14141a; color:#c9c9d4; font:12px/1.5 monospace; padding:16px; margin:0; }
  h2 { color:#9146ff; font-size:14px; margin:22px 0 6px; border-bottom:1px solid #333; padding-bottom:3px; }
  h2:first-child { margin-top:0; }
  .row { display:flex; align-items:flex-end; gap:26px; flex-wrap:wrap; }
  .cell { text-align:center; }
  .cell div { margin-top:4px; color:#777; }
  canvas { image-rendering: pixelated; background:#22222b; outline:1px solid #333; }
  #big { background:#2a2f3a; }
</style>
</head>
<body>
<h2>MissPolaroid — animaciones</h2>
<div class="row" id="miso"></div>
<h2>Alejandro — animaciones</h2>
<div class="row" id="alex"></div>
<h2>Enemigos</h2>
<div class="row" id="enemigos"></div>
<h2>Iconos (cartas de mejora)</h2>
<div class="row" id="iconos"></div>
<h2>Cabeza gigante (pasiva ×1.8)</h2>
<div class="row" id="big"></div>

<script src="js/sprites.js"></script>
<script>
Sprites.init();
const SCALE = 7;

function composedCanvas(pre, headName, bodyName, scale, headScale) {
  scale = scale || SCALE;
  headScale = headScale || 1;
  const body = Sprites.get(bodyName);
  const head = Sprites.get(headName);
  const hs = headScale;
  const hw = head.width * hs, hh = head.height * hs;
  const above = Math.max(0, hh - 4);
  const w = Math.max(16, Math.ceil(hw));
  const c = document.createElement('canvas');
  c.width = w * scale;
  c.height = (body.height + above) * scale;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  const bodyY = above;
  const headY = bodyY + 4 - hh;
  x.fillStyle = 'rgba(0,0,0,0.18)';
  x.beginPath(); x.ellipse(c.width/2, (bodyY + body.height - 2) * scale, 8*scale, 2*scale, 0, 0, Math.PI*2); x.fill();
  x.drawImage(body, (w - body.width)/2 * scale, bodyY * scale, body.width * scale, body.height * scale);
  x.drawImage(head, (w - hw)/2 * scale, headY * scale, hw * scale, hh * scale);
  return c;
}

function plain(name, scale) {
  scale = scale || SCALE;
  const s = Sprites.get(name);
  const c = document.createElement('canvas');
  c.width = s.width * scale; c.height = s.height * scale;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(s, 0, 0, c.width, c.height);
  return c;
}

function cell(parent, canvas, label) {
  const d = document.createElement('div');
  d.className = 'cell';
  d.appendChild(canvas);
  const l = document.createElement('div');
  l.textContent = label;
  d.appendChild(l);
  document.getElementById(parent).appendChild(d);
}

const miso = [
  ['p_head_down', 'p_body_down0', 'down f0'],
  ['p_head_down', 'p_body_down1', 'down f1'],
  ['p_head_down2', 'p_body_down0', 'parpadeo'],
  ['p_head_down_hurt', 'p_body_down0', 'daño'],
  ['p_head_down_fl', 'p_body_down0', 'flequillo + ojo'],
  ['p_head_up', 'p_body_up0', 'up f0'],
  ['p_head_up', 'p_body_up1', 'up f1'],
  ['p_head_side', 'p_body_side0', 'side f0'],
  ['p_head_side', 'p_body_side1', 'side f1'],
  ['p_head_side', 'p_body_side2', 'side f2'],
  ['p_head_side', 'p_body_side3', 'side f3'],
];
miso.forEach(([h, b, l]) => cell('miso', composedCanvas('', h, b), l));

const alex = [
  ['a_head_down', 'a_body_down0', 'down f0'],
  ['a_head_down', 'a_body_down1', 'down f1'],
  ['a_head_down_hurt', 'a_body_down0', 'daño'],
  ['a_head_side', 'a_body_side0', 'side f0'],
  ['a_head_side', 'a_body_side1', 'side f1'],
];
alex.forEach(([h, b, l]) => cell('alex', composedCanvas('', h, b), l));

['contrato', 'practicas', 'manager', 'form', 'email', 'cv', 'empresa', 'burocracia']
  .forEach(n => cell('enemigos', plain(n, n === 'burocracia' || n === 'manager' ? 3 : 5), n));

['cabeza', 'flequillo', 'alejandro', 'vida', 'bits', 'grito', 'micro', 'polaroid']
  .forEach(n => cell('iconos', plain('ic_' + n, 6), 'ic_' + n));

cell('big', composedCanvas('', 'p_head_down', 'p_body_down0', 7, 1.8), 'x1.8');
</script>
</body>
</html>
